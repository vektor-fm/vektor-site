{{NAV}}

<!-- the issue marker, kept: it is the only per-page label in the bar -->
<div class="issue-marker">{{MARKER}}</div>

<!-- Sticky ask. This used to be a Follow link back to Instagram, which spent
     an IG click to win a visit and then returned the visitor to IG without
     capturing anything. The goal is the email address, so the persistent ask
     is now the email. Follow demotes to the footer. -->
<div class="sticky-cta" id="stickyCta" aria-hidden="true">
  <span class="t">{{MAGNET}} + one working setup a week</span>
  <form class="sticky-form" method="post" action="https://vektor-ig-dm.vektor-fm.workers.dev/signup" data-capture="sticky">
      <input type="hidden" name="tag" value="masthead-sticky">
      <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <label class="sr-only" for="stickyEmail">Email address</label>
    <input id="stickyEmail" name="email" type="email" placeholder="you@email.com" autocomplete="email" required>
    <button class="btn primary" type="submit">Get it &rarr;</button>
  </form>
  <button class="x" id="ctaClose" type="button" aria-label="Dismiss">&times;</button>
</div>

<div class="weave" aria-hidden="true"></div>

<div class="pop" id="packPop" hidden>
  <div class="pop-scrim" data-pop-close></div>
  <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="popH">
    <button class="pop-x" type="button" data-pop-close aria-label="Close">×</button>
    <span class="k">One email a week · the working setup</span>
    <h2 id="popH">{{MAGNET_TITLE}}</h2>
    <p>Free, no wall. Add your email and The Teardown sends {{MAGNET}} plus one working AI setup a week.</p>
    <form action="https://vektor-ig-dm.vektor-fm.workers.dev/signup" method="post" data-capture="popup">
      <input type="hidden" name="tag" value="masthead-popup">
      <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <input type="email" name="email" placeholder="you@email.com" aria-label="Email address" autocomplete="email" required>
      <button class="btn" type="submit">Get the weekly pack →</button>
    </form>
    <div class="note">Free. The config pack lands in your inbox straight away. Unsubscribe anytime.</div>
  </div>
</div>
