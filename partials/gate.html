<!-- THE GATE. Founder decision 2026-08-26: the packs stop being free-to-scroll,
     and the ask is the loudest object on the page. ~700 landing-page opens in 30
     days produced 6 form clicks (live /report, 2026-08-26), so the pages were
     handing the payload over before the ask and the ask had no leverage.

     The payload is NOT in this document. build.mjs splits the body at the first
     <div class="fig"> and writes everything below it to a separate unlock page
     whose URL only the funnel worker knows. There is nothing here to view-source.

     WHY IT LOOKS LIKE THIS (founder picked A1, "paper block", 2026-08-26):
     - Cream on an all-black site. It is the only light surface anywhere in the
       design system, so the eye lands on it before it reads a word. Loud through
       contrast rather than through decoration.
     - The manifest lists the REAL payload — file names and line counts pulled
       from the page's own snippets at build time, redacted. Paywall CRO is
       consistent that showing what is missing beats describing it, and a
       manifest cannot be faked into promising something the pack doesn't hold.
     - It shows structure, never a readable line. Behavioural data on news
       paywalls (Journalism Studies, 2024) found a readable teaser measurably
       LOWERS subscribe clicks — curiosity gets satisfied and the reader leaves.
     - One field. Single-field forms benchmark at ~25.5%, and every extra field
       is the highest-cost thing you can add.
     - The note kills the objection single opt-in always raises: nothing to
       confirm, nothing to wait for.
     Evidence + sources: docs/2026-08-26-gate-ui-research.md -->
<section class="gate paper" id="gate">
  <div class="tab">Locked</div>
  <div class="inner">
    <span class="k">{{GATE_META}}</span>
    <h2>{{GATE_TITLE}}</h2>
    <p class="lede">{{GATE_LEDE}}</p>

    <ul class="manifest">
{{GATE_MANIFEST}}
    </ul>

    <form class="gate-form" action="https://vektor-ig-dm.vektor-fm.workers.dev/signup" method="post" data-capture="gate">
      <input type="hidden" name="tag" value="{{SLUG}}">
      <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <label class="sr-only" for="gateEmail">Email address</label>
      <input id="gateEmail" name="email" type="email" placeholder="you@email.com" autocomplete="email" inputmode="email" required>
      <button class="btn primary" type="submit">{{GATE_BUTTON}}</button>
    </form>
    <!-- The last line exists because there is deliberately NO welcome email
         (founder, 2026-08-26): the redirect is the whole delivery, so a closed
         tab loses the pack. Retyping the same address works — an existing
         subscriber is let straight back through (signup.js) — but nobody would
         guess that, and a reader who thinks they've lost it doesn't come back. -->
    <div class="note">Opens on the next screen — no confirmation email, no waiting room. Lost the tab? Type the same address again and it reopens. One-click unsubscribe. <a href="./privacy.html">What we do with it</a>.</div>
    <div class="proof">{{GATE_PROOF}}</div>
  </div>
</section>
