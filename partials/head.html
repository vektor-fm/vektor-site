<style>
  :root{
    --ink:#101010; --paper:#EFEADD; --cream:#F4EFDF; --fog:#E8ECEA;
    --orchid:#C77BC9; --aqua:#8FC5C9; --acid:#39FF35; --teal:#0E9C86;
    --blue-a:#1B4FA0; --blue-b:#2B6BC4; --blue-c:#153A78; --blue-meta:#BFD9FF;
    --disp:'Tektur',system-ui,sans-serif;
    --kick:'Workbench','IBM Plex Mono',monospace;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --goth:'Jacquard 24',serif;
    --wm:'Inter Tight',system-ui,sans-serif;
    --rail:clamp(18px,5.5vw,64px);
  }
  *{box-sizing:border-box;}
  :focus-visible{outline:2px solid var(--acid); outline-offset:2px;}
  html,body{margin:0;}
  body{ background:var(--ink); color:var(--paper); font-family:var(--mono); -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden; }
  a{color:inherit;}
  ::selection{background:var(--acid); color:var(--ink);}
  .kick{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.14em; font-size:13px; line-height:1.4;}
  .rule{font-family:var(--mono); color:rgba(239,234,221,0.4); overflow:hidden; white-space:nowrap; user-select:none;}
  .disp{font-family:var(--disp); font-weight:900; text-transform:uppercase; line-height:1.02; letter-spacing:0.005em;}
  .chrome{ position:sticky; top:0; z-index:50; background:var(--ink); border-bottom:1px solid #262626; display:flex; align-items:center; justify-content:space-between; height:64px; padding:0 var(--rail); }
  .chrome .marker{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:13px; color:#8f8b80;}
  @media (max-width:520px){ .chrome .marker{display:none;} }
  .wm{position:relative; display:inline-flex; text-decoration:none; font-family:var(--wm); font-weight:600; letter-spacing:-0.045em; color:var(--paper); font-size:30px; line-height:1;}
  .wm-main{position:relative; z-index:2; display:inline-flex;}
  .wm-main .ch{position:relative; display:inline-block;}
  .wm-main .ch .l{opacity:0; animation:showL .01s steps(1) forwards; animation-delay:calc(0.20s + var(--i)*0.075s);}
  .wm-main .ch .g{position:absolute; left:0; top:0; font-family:var(--mono); color:var(--acid); opacity:0; animation:flashG .075s steps(1) forwards; animation-delay:calc(0.14s + var(--i)*0.075s);}
  @keyframes showL{to{opacity:1;}}
  @keyframes flashG{0%{opacity:1;}100%{opacity:0;}}
  .wm-plate{position:absolute; left:0; top:0; z-index:1; mix-blend-mode:screen; pointer-events:none;}
  .wm-acid{color:var(--acid); animation:regA 1.15s steps(1) forwards;}
  .wm-orchid{color:var(--orchid); animation:regB 1.15s steps(1) forwards;}
  @keyframes regA{0%{transform:translate(7px,4px);opacity:.85}30%{transform:translate(4px,2px)}55%{transform:translate(2px,1px)}78%{transform:translate(0,0);opacity:.5}100%{transform:translate(0,0);opacity:0}}
  @keyframes regB{0%{transform:translate(-6px,-4px);opacity:.85}30%{transform:translate(-4px,-2px)}55%{transform:translate(-2px,-1px)}78%{transform:translate(0,0);opacity:.5}100%{transform:translate(0,0);opacity:0}}
  @media (prefers-reduced-motion:reduce){ .wm-main .ch .l{opacity:1; animation:none;} .wm-main .ch .g,.wm-plate{display:none;} .wm-foot.play .ch2 .l{animation:none;} .wm-foot .ch2 .g{display:none;} }
  .weave{ height:26px; width:min(230px,60vw); margin:0 0 0 var(--rail); background-color:var(--aqua); background-image: repeating-linear-gradient(90deg, rgba(16,16,16,.55) 0 3px, transparent 3px 9px), repeating-linear-gradient(0deg, rgba(16,16,16,.55) 0 3px, transparent 3px 9px), repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 1px, transparent 1px 9px); background-blend-mode:multiply; }
  .hero{padding:38px var(--rail) 30px; position:relative;}
  .hero .eye{color:var(--aqua); margin-bottom:20px;}
  .hero h1{margin:0; font-size:clamp(40px,11vw,120px);}
  .hero h1 .dot{color:var(--acid);}
  .hero .sub{max-width:44ch; margin-top:24px; font-size:16px; line-height:1.55; color:var(--paper);}
  .hero .rule{margin-top:34px; font-size:15px;}
  .fig{padding:26px var(--rail) 6px; display:flex; align-items:center; gap:16px;}
  .fig .kick{color:#8f8b80; white-space:nowrap;}
  .fig .line{flex:1; height:1px; background:#2a2a2a;}
  .fig h2{margin:0;}
  .fig .gaccent{font-family:var(--goth); font-size:34px; color:var(--paper); line-height:0.7;}
  .issues{padding:12px var(--rail) 0;}
  .card{position:relative; margin:16px 0; padding:26px 24px 24px; overflow:hidden;}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
  .card .tag{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.12em; font-size:13px;}
  .card .goth{font-family:var(--goth); font-size:52px; line-height:0.8; margin-top:-6px;}
  .card h2{font-family:var(--disp); font-weight:900; text-transform:uppercase; line-height:1; letter-spacing:0.005em; font-size:clamp(30px,8.5vw,56px); margin:18px 0 0; overflow-wrap:break-word;}
  .card .one{font-size:15.5px; line-height:1.5; margin-top:12px; max-width:48ch;}
  .card .proof{display:inline-block; margin-top:16px; font-family:var(--mono); font-size:13px; padding:8px 12px; background:var(--ink); color:var(--acid); border:1px solid #2a2a2a;}
  .c-cream .proof,.c-aqua .proof{background:var(--ink); color:var(--acid);}
  .card .stars{display:inline-block; margin-top:16px; font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:12px; padding:8px 12px; background:var(--ink); color:var(--cream);}
  .card .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; align-items:stretch;}
  .btn{ display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 20px; font-family:var(--kick); text-transform:uppercase; letter-spacing:0.08em; font-size:14px; text-decoration:none; border:2px solid currentColor; background:transparent; cursor:pointer; }
  .copy{ display:flex; align-items:center; min-height:48px; border:2px solid; padding:0 6px 0 14px; gap:10px; font-family:var(--mono); font-size:13.5px; flex:1 1 240px; min-width:0; justify-content:space-between; }
  .copy code{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .copybtn{display:none; flex:none; align-items:center; min-height:44px; padding:0 12px; margin:2px 0; font-family:var(--kick); text-transform:uppercase; letter-spacing:0.08em; font-size:12px; border:0; cursor:pointer;}
  .js .copybtn{display:inline-flex;}
  .snippet{ position:relative; margin-top:18px; border:2px solid #3a3a3a; background:#0b0b0b; }
  .snippet .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 8px 8px 14px; border-bottom:1px solid #262626;}
  .snippet .bar .f{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:12px; color:#8f8b80;}
  .snippet pre{margin:0; padding:16px 14px; overflow-x:auto; max-height:60vh; overflow-y:auto; font-family:var(--mono); font-size:13px; line-height:1.55; color:var(--paper); white-space:pre-wrap; word-break:break-word;}
  .snippet .snipbtn{flex:none; min-height:38px; padding:0 12px; font-family:var(--kick); text-transform:uppercase; letter-spacing:0.08em; font-size:12px; border:0; cursor:pointer; background:var(--acid); color:var(--ink);}
  #shareBtn{display:none;}
  .js #shareBtn{display:inline-flex;}
  .ledger{padding:10px var(--rail) 6px;}
  .lrow{display:flex; gap:18px; align-items:baseline; border-top:2px solid #2a2a2a; padding:20px 0;}
  .lrow:last-of-type{border-bottom:2px solid #2a2a2a;}
  .lrow .n{font-family:var(--disp); font-weight:900; font-size:40px; color:var(--aqua); flex:none; line-height:1;}
  .lrow .t{font-family:var(--mono); font-size:15px; text-transform:uppercase; letter-spacing:0.04em; line-height:1.4;}
  .c-aqua{background:var(--aqua); color:var(--ink);}
  .c-cream{background:var(--cream); color:var(--ink);}
  .c-aqua .goth,.c-cream .goth{color:var(--ink);}
  .c-aqua .tag,.c-cream .tag{color:rgba(16,16,16,0.8);}
  .c-aqua .btn,.c-cream .btn{color:var(--ink);}
  .c-aqua .btn:hover,.c-cream .btn:hover{background:var(--ink); color:var(--paper);}
  .c-aqua .copy,.c-cream .copy{border-color:rgba(16,16,16,0.45); color:var(--ink);}
  .c-aqua .copybtn,.c-cream .copybtn{background:var(--ink); color:var(--paper);}
  .c-ink{background:var(--ink); color:var(--paper); border:1px solid #2a2a2a;}
  .c-ink .tag{color:#8f8b80;}
  .c-ink .goth{color:var(--cream);}
  .c-ink .btn{color:var(--cream); border-color:var(--cream);}
  .c-ink .btn:hover{background:var(--cream); color:var(--ink);}
  .c-ink .copy{border-color:#3a3a3a; color:var(--paper);}
  .c-ink .copybtn{background:var(--cream); color:var(--ink);}
  footer{margin-top:40px; padding:44px var(--rail) 60px; border-top:1px solid #262626;}
  .foot-rule{font-size:15px; margin-bottom:34px;}
  .news label{display:block; color:var(--acid); margin-bottom:12px;}
  .news h2{margin:0 0 12px; font-weight:400;}
  .news form{display:flex; gap:10px; flex-wrap:wrap; max-width:520px;}
  .news input{flex:1 1 220px; min-height:48px; background:transparent; border:2px solid #6a6a6a; color:var(--paper); font-family:var(--mono); font-size:15px; padding:0 14px;}
  .news input:focus{outline:none; border-color:var(--acid);}
  .news .btn{color:var(--acid); border-color:var(--acid);}
  .news .btn:hover{background:var(--acid); color:var(--ink);}
  .news .note{font-size:12px; color:#8f8b80; margin-top:10px; letter-spacing:0.04em;}
  .pack{display:flex; flex-wrap:wrap; gap:8px 22px; margin:12px 0 18px;}
  .pack span{font-family:var(--mono); font-size:13.5px; color:#8f8b80;}
  .pack span::before{content:"\25B8 "; color:var(--acid);}
  .socials{display:flex; flex-wrap:wrap; gap:22px; margin-top:38px;}
  .socials a{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:13px; color:#8f8b80; text-decoration:none; padding:12px 0; margin:-12px 0;}
  .socials a:hover{color:var(--acid);}
  .backref{margin-top:34px; font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:13px; color:var(--paper);}
  .backref b{color:var(--acid);}
  .backref a{color:var(--acid);}
  .wordmark-foot{display:flex; align-items:center; gap:14px; margin-top:40px;}
  .wordmark-foot .m{font-family:var(--mono); font-size:12px; color:#8f8b80;}
  .hero .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px;}
  .hero .actions .btn{color:var(--paper); border-color:var(--paper);}
  .hero .actions .btn:hover{background:var(--paper); color:var(--ink);}
  .hero .actions .btn.primary{background:var(--aqua); color:var(--ink); border-color:var(--aqua);}
  .hero .actions .btn.primary:hover{background:#a9d6da; color:var(--ink);}
  .sticky-cta{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--ink); border-top:1px solid #2a2a2a; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px var(--rail) calc(12px + env(safe-area-inset-bottom)); transform:translateY(130%); transition:transform .3s ease;}
  .sticky-cta.show{transform:translateY(0);}
  .sticky-cta .t{font-family:var(--kick); text-transform:uppercase; letter-spacing:0.1em; font-size:13px; color:var(--paper);}
  .sticky-cta .t b{color:var(--acid);}
  .sticky-cta .r{display:flex; align-items:center; gap:8px; flex:none;}
