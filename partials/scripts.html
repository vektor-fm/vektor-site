

<script>
  // head.html hides #shareBtn and un-hides it with `.js #shareBtn`, the standard
  // no-JS progressive-enhancement pattern - but nothing ever set the class, so the
  // share button was display:none on every built page while its click handler below
  // sat there wired and unreachable (found 2026-09-14 on no-052, present on all 37).
  document.documentElement.classList.add('js');
  function fallback(text){ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.focus(); t.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(t); }
  function copyText(text, btn, doneLabel){ var o=btn.textContent, done=function(){ btn.textContent=doneLabel; setTimeout(function(){btn.textContent=o;},1600); }; if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(text); done(); }); } else { fallback(text); done(); } }
  function gcEvent(name){ if(name && window.goatcounter && goatcounter.count){ goatcounter.count({path:name, event:true}); } }
  var COPY_EVENT={{COPY_EVENT_JS}};
  document.querySelectorAll('.copybtn').forEach(function(btn){ btn.addEventListener('click', function(){ copyText(btn.getAttribute('data-copy'), btn, 'Copied ✓'); gcEvent(COPY_EVENT); }); });
  var snip=document.getElementById('snipCopy');
  if(snip){ snip.addEventListener('click', function(){ var el=document.getElementById('snipText'); copyText(el.textContent, snip, 'Copied ✓'); gcEvent(COPY_EVENT); }); }
  // generic copy hook (legacy multi-card pages): data-copy-target="all" | "#id"; optional data-copy-event
  document.querySelectorAll('[data-copy-target]').forEach(function(btn){ btn.addEventListener('click', function(){ var t=btn.getAttribute('data-copy-target'), text; if(t==='all'){ text=[].slice.call(document.querySelectorAll('.copybtn')).map(function(b){return b.getAttribute('data-copy');}).join('\n'); } else { var el=document.querySelector(t); text=el?el.textContent:''; } copyText(text, btn, 'Copied ✓'); gcEvent(btn.getAttribute('data-copy-event')); }); });
  var camp=(location.pathname.split('/').pop()||'index').replace(/\.html$/,'')||'index';
  document.querySelectorAll('a[href^="http"]').forEach(function(a){ try{ var u=new URL(a.href); if(u.hostname==='github.com'){return;} if(!u.searchParams.has('utm_source')){ u.searchParams.set('utm_source','vektor'); u.searchParams.set('utm_medium','dm'); u.searchParams.set('utm_campaign',camp); a.href=u.toString(); } }catch(e){} });
  var sh=document.getElementById('shareBtn');
  if(sh){ sh.addEventListener('click', function(){ gcEvent('{{SLUG}}-share'); if(navigator.share){ navigator.share({title:document.title, url:location.href}).catch(function(){}); } else { copyText(location.href, sh, 'Link copied — paste it ✓'); } }); }
  var sticky=document.getElementById('stickyCta'), sub=document.getElementById('subscribe'), dismissed=false, stickyViewed=false;
  var midcap=document.querySelector('.midcap');
  // v2 (2026-09-24): visible FROM LOAD, not after scrolling past the whole
  // payload. Evidence: the five biggest keyword campaigns drew 1,097 opens
  // and captured 41 emails lifetime (~4 per 100, worker /report) — the old
  // scroll-gated bar only appeared after the reader had scrolled past the
  // ENTIRE free payload, so most mobile readers who bounced early never saw
  // an ask at all. The only reasons left to hide it: the reader dismissed
  // it, or a page form (midcap / footer #subscribe) is intersecting the
  // bar's own strip (bottom 130px), so it never covers or competes with a
  // form CTA already in view.
  function inBarZone(el){ if(!el){return false;} var r=el.getBoundingClientRect(); return r.top<window.innerHeight && r.bottom>window.innerHeight-130; }
  // guarded: unlock pages omit capture.html entirely (build.mjs), so #stickyCta
  // does not exist there — this already threw on every u-no-*.html page before
  // v2 (unguarded sticky.classList calls), just silently, since nothing downstream
  // depended on it running. Guarding it here rather than leaving that landmine.
  if(sticky){
    function updCta(){
      if(dismissed){ sticky.classList.remove('show'); sticky.setAttribute('aria-hidden','true'); return; }
      var show=!inBarZone(midcap) && !inBarZone(sub);
      sticky.classList.toggle('show', show);
      sticky.setAttribute('aria-hidden', show?'false':'true');
      // view-of-ask event, once per page view, the moment it first becomes visible
      // (almost always on load) — gives the submit counts a denominator.
      if(show && !stickyViewed){ stickyViewed=true; gcEvent('{{SLUG}}-sticky-view'); }
    }
    window.addEventListener('scroll',updCta,{passive:true}); window.addEventListener('resize',updCta); updCta();
    var ctaClose=document.getElementById('ctaClose');
    if(ctaClose){ ctaClose.addEventListener('click', function(){ dismissed=true; sticky.classList.remove('show'); sticky.setAttribute('aria-hidden','true'); }); }
    // role pills: one optional tap, POSTs as `role` (each radio carries
    // form="stickyForm" so it submits with the sticky form without being
    // nested inside it). Its own event per tap, so the choice is measurable
    // even from a reader who taps a pill and never submits.
    document.querySelectorAll('.role-pick input[type="radio"]').forEach(function(r){
      r.addEventListener('change', function(){ if(r.checked){ gcEvent('{{SLUG}}-sticky-role-'+r.value); } });
    });
  }
  var wmFoot=document.getElementById('wmFoot');
  if(wmFoot && 'IntersectionObserver' in window){ var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ wmFoot.classList.remove('play'); void wmFoot.offsetWidth; wmFoot.classList.add('play'); } }); }, {threshold:0.6}); io.observe(wmFoot); }
  // THE ASK MODAL — an A/B on the TRIGGER, not on the copy (2026-09-01).
  //
  // History, so nobody re-litigates it from memory: this started as a 900 ms
  // setTimeout, which covered the mobile viewport before the reader had read a
  // word — the exact pattern Google penalises on mobile. It was moved to 50%
  // scroll depth on 2026-08-17, then removed entirely on 2026-08-26 when a hard
  // email gate went on the end of the page instead. The gate is now gone too
  // (founder, 2026-09-01) and the pack is free on the page, so the modal is the
  // primary ask again.
  //
  // The scroll version's record, pulled live from /report on 2026-09-01 over a
  // 30-day window: ~47 views, ~46 dismissals, no attributable signup. The
  // founder's position is that the ask should land at peak attention and that a
  // half-page scroll is the wrong signal for it. Rather than argue it, both
  // triggers ship and split 50/50:
  //
  //   arm a — 6 s timer            (fires on a clock, on everyone)
  //   arm b — download/copy click  (fires on the action, after value landed)
  //
  // Read the result off count:email:<slug>-ask-a vs -ask-b in /report (the tag
  // travels to Buttondown, so it survives ad-blockers that eat GoatCounter) and
  // off {{SLUG}}-ask-view-a/-dismiss-a vs the -b pair for the dismissal rate.
  // Decide after 3 films, not after one — at ~40-60 page opens per film, one
  // film cannot separate these.
  (function(){
    var pop=document.getElementById('askPop'); if(!pop){return;}
    var KEY='vektor_ask_seen', ARM_KEY='vektor_ask_arm', TTL=2*24*60*60*1000;

    // ?arm=a / ?arm=b forces an arm, ?pop=1 forces it open past the cooldown.
    // Without these the thing is untestable for anyone who has already seen it:
    // on 2026-08-17 the page looked broken for two days when the real cause was
    // a dismissal 21 hours earlier. Test affordances, not features.
    var qs; try{ qs=new URLSearchParams(location.search); }catch(e){ qs=null; }
    var force=!!qs && qs.get('pop')==='1';
    var forcedArm=qs && (qs.get('arm')==='a' || qs.get('arm')==='b') ? qs.get('arm') : null;

    // The arm is sticky per browser: a reader who saw the timer must never also
    // see the action version, or every number here is a mixture of both.
    var arm=forcedArm;
    if(!arm){
      try{ arm=localStorage.getItem(ARM_KEY); }catch(e){}
      if(arm!=='a' && arm!=='b'){
        arm = Math.random()<0.5 ? 'a' : 'b';
        try{ localStorage.setItem(ARM_KEY, arm); }catch(e){}
      }
    }
    var tag=document.getElementById('askTag');
    if(tag){ tag.value='{{SLUG}}-ask-'+arm; }

    if(!force){ try{ var last=parseInt(localStorage.getItem(KEY)||'0',10); if(last && (Date.now()-last)<TTL){ return; } }catch(e){} }
    function seen(){ try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} }
    function esc(e){ if(e.key==='Escape'){ close(); } }
    function close(){ pop.setAttribute('hidden',''); seen(); document.removeEventListener('keydown',esc); gcEvent('{{SLUG}}-ask-dismiss-'+arm); }
    pop.querySelectorAll('[data-pop-close]').forEach(function(el){ el.addEventListener('click', close); });
    // submit fires seen() but NOT close(), so a dismissal count is never
    // inflated by a conversion — dismiss ≈ view is then a real read.
    var f=pop.querySelector('form');
    if(f){ f.addEventListener('submit', function(){ seen(); gcEvent('{{SLUG}}-ask-submit-'+arm); }); }

    var fired=false;
    function open(){
      if(fired){ return; }
      fired=true;
      pop.removeAttribute('hidden');
      document.addEventListener('keydown',esc);
      gcEvent('{{SLUG}}-ask-view-'+arm);
      var x=pop.querySelector('.pop-x'); if(x){ try{ x.focus(); }catch(e){} }
    }

    if(force){ open(); return; }

    if(arm==='a'){
      // 6 s from load. Not 3 s: under 5 s is the band the mobile-interstitial
      // guidance treats as pre-engagement, and if this arm is going to lose it
      // should lose on its own best showing.
      setTimeout(open, 6000);
    } else {
      // Peak intent: the click that takes the payload. Covers every route the
      // pages use — the file links, the .copybtn snippets, the single-snippet
      // button and the legacy multi-card copy buttons. 900 ms of delay so the
      // "Copied ✓" confirmation is seen first; a modal that lands on the same
      // frame as the click reads as an error, not an offer.
      document.addEventListener('click', function(ev){
        var t=ev.target && ev.target.closest ? ev.target.closest('.copybtn, #snipCopy, [data-copy-target], a[href*="./files/"]') : null;
        if(!t){ return; }
        setTimeout(open, 900);
      }, true);
    }
  })();{{SUBSCRIBE_BLOCK}}

  // ---- shared nav: reveal + mobile drawer ----
  // The header sits off-screen until a 24px hover strip is entered (desktop) or
  // the Menu word is tapped (mobile). Touch devices never hover, so the bar is
  // shown from the start there or the nav would be unreachable.
  (function(){
    var menu=document.querySelector('.menu'); if(!menu){return;}
    var reveal=function(){ menu.classList.add('nav-visible'); };
    var strip=document.querySelector('.navreveal'); if(strip){ strip.addEventListener('mouseenter',reveal); }
    menu.addEventListener('focusin',reveal);
    var word=document.querySelector('.menu-word');
    if(word){
      word.addEventListener('click',function(){
        reveal();
        var open=menu.classList.toggle('drawer-open');
        word.setAttribute('aria-expanded',String(open));
        word.setAttribute('aria-label',open?'Close menu':'Open menu');
        var lbl=word.querySelector('.lbl'); if(lbl){ lbl.textContent=open?'Close':'Menu'; }
        document.body.style.overflow=open?'hidden':'';
      });
    }
    if(window.matchMedia('(hover: none)').matches){ reveal(); }
  })();

  // Instrumentation before optimisation. Every capture point reports its own
  // event, so we can see which of the four actually earns its place instead of
  // guessing. Previously all of them fired one shared 'subscribe-submit'.
  // (Sticky-bar view is fired from updCta() above, not here — v1 used a
  // MutationObserver to catch the show-class toggle, which only fired for a
  // toggle AFTER it attached; now the bar shows on load, before the observer
  // would even exist, so that path would have gone silent.)
  document.querySelectorAll('form[data-capture]').forEach(function(f){
    f.addEventListener('submit', function(){
      gcEvent('{{SLUG}}-sub-' + f.getAttribute('data-capture'));
    });
  });
</script>

<script data-goatcounter="https://vektor.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body></html>
