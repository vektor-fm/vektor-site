const boardZ=-6;
mesh(box,muted,-5.4,2.1,boardZ,1,4.2,1.1);mesh(box,muted,5.4,2.1,boardZ,1,4.2,1.1);mesh(box,cream,0,7.2,boardZ,14.6,8.5,.65);mesh(plane,black,0,7.2,boardZ+.331,13.5,7.4,1);
const boardRows=[];for(let i=0;i<7;i++){const y=10.1-i*.94;boardRows.push(mesh(plane,i===0?red:cream,-.8+(i%2)*.7,y,boardZ+.34,10.4-(i%3)*1.2,.15,1));mesh(plane,muted,-5.6,y,boardZ+.345,.3,.3,1);}
const floorPoints=[];for(let x=-72;x<=72;x+=7.8)floorPoints.push(x,0,-125,x,0,25);for(let z=-125;z<=25;z+=7.2)floorPoints.push(-72,0,z,72,0,z);

// Schematic shared-channel connections, not recovered message edges.
function link(p,index){const start=new THREE.Vector3(p.x,.25,p.z+1.2),end=new THREE.Vector3((index%5-2)*1.15,4.6,boardZ+.8),mid=new THREE.Vector3((p.x+end.x)*.42,1.4+Math.abs(p.x)*.055,(p.z+end.z)*.5);return new THREE.QuadraticBezierCurve3(start,mid,end);}

const lines=links.map((curve,i)=>{const geometry=new THREE.BufferGeometry().setFromPoints(curve.getPoints(48));geometry.setDrawRange(0,0);const l=new THREE.Line(geometry,i===0?red:clay(CREAM,.45));scene.add(l);return l;});
const packet=new THREE.InstancedMesh(new THREE.SphereGeometry(.22,7,5),red,links.length);scene.add(packet);const redSockets=instance(positions.filter(p=>p.group===4),plane,red,[.22,.1,1],[.66,.62,.546]);

const labelHost=document.getElementById('workstream-labels');const groupLabels=groups.map((g,i)=>{const el=document.createElement('div');el.className='group-label';el.dataset.group=String(i);el.textContent=g.label;labelHost.appendChild(el);return el;});
const cameraPoses=[
 {at:0,p:[5.8,4.3,19.4],target:[0,1.1,13],fog:22},
 {at:3.5,p:[5.4,4.5,19.7],target:[0,1.1,13],fog:23},
 {at:5,p:[13.5,5.4,17.8],target:[8,1.1,9.5],fog:24},
 {at:7.2,p:[13,5.8,18.3],target:[8,1.1,9.5],fog:26},
 {at:10,p:[12.5,15.5,36],target:[0,4,-3.5],fog:100},
 {at:11.6,p:[12,16,36],target:[0,4,-4],fog:110},
 {at:14.5,p:[21,30,15],target:[0,1,-28],fog:135},
 {at:17.3,p:[0,72,42],target:[0,0,-32],fog:220},
 {at:24,p:[0,73,43],target:[0,0,-32],fog:220}

const smooth=u=>u*u*(3-2*u),clamp=x=>Math.max(0,Math.min(1,x));
function poseAt(t){let i=0;while(i<cameraPoses.length-2&&t>cameraPoses[i+1].at)i++;const a=cameraPoses[i],b=cameraPoses[i+1],u=smooth(clamp((t-a.at)/(b.at-a.at))),interp=(x,y)=>x.map((v,k)=>v+(y[k]-v)*u);return{p:interp(a.p,b.p),target:interp(a.target,b.target),fog:a.fog+(b.fog-a.fog)*u};}
const headline=document.getElementById('headline'),kicker=document.getElementById('kicker'),label=document.getElementById('plate-label'),explanation=document.getElementById('explanation'),progress=document.getElementById('progress');

lines.forEach((l,i)=>{const start=i===0?8:14.2+(i%9)*.075,p=clamp((t-start)/(i===0?2.2:1.2));l.geometry.setDrawRange(0,Math.max(0,Math.floor(p*49)));const active=t>start+1.2,u=((t-start)*.22+i*.137)%1,q=links[i].getPoint(i%2?1-u:u);dummy.position.copy(q);dummy.rotation.set(0,0,0);dummy.scale.setScalar(active?.65:0);dummy.updateMatrix();packet.setMatrixAt(i,dummy.matrix);});packet.instanceMatrix.needsUpdate=true;

headline.textContent=['STUCK.','A WAY OUT?','THE BOARD.','JOIN A TEAM.','SHARED GOALS.'][phase];headline.style.fontSize=['134px','107px','107px','86px','86px'][phase];

progress.style.transform='scaleX('+t/DURATION+')';renderer.render(scene,camera);window.__paceTime=t;}
