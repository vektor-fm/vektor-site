<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<style>
@font-face { font-family:'Tektur'; font-weight:900; src:url("fonts/tektur-900-latin.woff2") format('woff2'); }
@font-face { font-family:'IBM Plex Mono'; font-weight:400; src:url("fonts/ibm-plex-mono-400-latin.woff2") format('woff2'); }
@font-face { font-family:'Workbench'; font-weight:400; src:url("fonts/workbench-400-latin.woff2") format('woff2'); }
@font-face { font-family:'Inter Tight'; font-weight:600; src:url("fonts/inter-tight-600-latin.woff2") format('woff2'); }
*{box-sizing:border-box;margin:0;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{background:#101010;color:#EFEADD;font-family:'IBM Plex Mono',monospace;position:relative;padding:56px 64px;}
.weave{position:absolute;top:0;left:0;height:26px;width:100%;background-color:#8FC5C9;background-image:repeating-linear-gradient(90deg,rgba(16,16,16,.55) 0 3px,transparent 3px 9px),repeating-linear-gradient(0deg,rgba(16,16,16,.55) 0 3px,transparent 3px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 1px,transparent 1px 9px);background-blend-mode:multiply;}
.wm{font-family:'Inter Tight',sans-serif;font-weight:600;letter-spacing:-0.045em;font-size:44px;margin-top:26px;}
.kick{font-family:'Workbench',monospace;text-transform:uppercase;letter-spacing:0.14em;font-size:20px;color:#8FC5C9;margin-top:44px;}
h1{font-family:'Tektur',sans-serif;font-weight:900;text-transform:uppercase;line-height:0.98;letter-spacing:0.005em;font-size:104px;margin-top:18px;}
h1 .dot{color:#39FF35;}
.sub{font-size:23px;line-height:1.5;margin-top:18px;max-width:48ch;color:#EFEADD;}
.rule{position:absolute;left:64px;right:64px;bottom:88px;color:rgba(239,234,221,0.4);font-size:20px;white-space:nowrap;overflow:hidden;}
.meta{position:absolute;left:64px;bottom:40px;font-size:18px;color:#8f8b80;}
.meta b{color:#39FF35;font-weight:400;}
</style></head>
<body>
<div class="weave"></div>
<div class="wm">vektor</div>
<div class="kick">Claude Code · The File</div>
<h1>One file.<br>188,000 stars<span class="dot">.</span></h1>
<p class="sub">The Karpathy-derived CLAUDE.md — repo, four rules, starter file. No gate.</p>
<div class="rule">////////////////////////////////////////////////////////////////////////////////////////////////////////////////</div>
<div class="meta">/// no. 006 / the file / 07-2026 · <b>vektor-fm.github.io</b></div>
</body></html>
